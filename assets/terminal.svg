<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Cortexyn command terminal</title>
  <desc id="desc">A dark cyberpunk terminal boot sequence for TheCodingCortex.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061619"/>
      <stop offset="0.58" stop-color="#0a2426"/>
      <stop offset="1" stop-color="#10191d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3c5"/>
      <stop offset="0.58" stop-color="#22d3c5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 7.5H8" stroke="#baf7f2" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .line { opacity: 1; animation: reveal 8s ease-out infinite; }
    .l1 { animation-delay: .25s; }
    .l2 { animation-delay: 1.25s; }
    .l3 { animation-delay: 2.25s; }
    .l4 { animation-delay: 3.25s; }
    .l5 { animation-delay: 4.4s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .node { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
    .n2 { animation-delay: 1.1s; }
    @keyframes reveal { 0%, 100% { opacity: .72; } 12%, 82% { opacity: 1; } }
    @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .line, .cursor, .node { animation: none; opacity: 1; } }
  </style>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#panel)" stroke="url(#edge)" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#scan)"/>
  <path d="M18 58H1182" stroke="#7ef5eb" stroke-opacity="0.24"/>
  <circle cx="32" cy="30" r="6" fill="#ff6b5e"/>
  <circle cx="52" cy="30" r="6" fill="#ffbd52"/>
  <circle cx="72" cy="30" r="6" fill="#36d399"/>
  <text x="600" y="36" text-anchor="middle" fill="#8db4b2" font-size="15" class="mono">CORTEXYN // COMMAND NODE</text>
  <g class="mono" font-size="21">
    <text x="42" y="96" class="line l1" fill="#d7fffb"><tspan fill="#ff9f43">$</tspan> cortexyn --boot</text>
    <text x="42" y="134" class="line l2" fill="#94b8b6"><tspan fill="#22d3c5">[ OK ]</tspan> identity :: TheCodingCortex</text>
    <text x="42" y="172" class="line l3" fill="#94b8b6"><tspan fill="#22d3c5">[ OK ]</tspan> focus    :: AI / AUTOMATION / DEVELOPMENT</text>
    <text x="42" y="210" class="line l4" fill="#94b8b6"><tspan fill="#22d3c5">[ OK ]</tspan> mission  :: build tools that think, connect, and ship</text>
    <text x="42" y="258" class="line l5" fill="#ffb568">&gt; THINK. CODE. EVOLVE. <tspan class="cursor" fill="#22d3c5">█</tspan></text>
  </g>
  <circle cx="1147" cy="93" r="4" fill="#22d3c5" class="node"/>
  <circle cx="1167" cy="93" r="4" fill="#ff9f43" class="node n2"/>
</svg>

