<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="225" viewBox="0 0 1200 225" role="img" aria-labelledby="title desc">
  <title id="title">Beyond the code</title>
  <desc id="desc">GAMING: Systems, addons, tools, and the worlds they support.; AVIATION: Soaring, weather signals, and flight-planning automation.; EXPERIMENTATION: Turning a stubborn what if into a working prototype.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#041416"/><stop offset="1" stop-color="#0b2023"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1be0d0"/><stop offset=".72" stop-color="#1be0d0" stop-opacity=".35"/><stop offset="1" stop-color="#ff9b42"/></linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#a3fffa" stroke-opacity=".025"/></pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .title { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight:700; fill:#d9f5f2; }
    .muted { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill:#83aaa8; }
  </style>
  <rect x="1" y="1" width="1198" height="223" rx="14" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="223" rx="14" fill="url(#grid)"/>
  <text x="38" y="36" class="mono" fill="#ff9b42" font-size="13" letter-spacing="1.4">OFF-DUTY SIGNALS // HUMAN LAYER</text>
  <g transform="translate(38 62)">
    <rect width="356" height="135" rx="12" fill="#082326" stroke="#1be0d0" stroke-opacity=".55"/>
    <text x="20" y="31" class="mono" fill="#1be0d0" font-size="11" letter-spacing="1.3">PLAY // 01</text>
    <text x="20" y="63" class="title" font-size="19">GAMING</text>
    <text x="20" y="92" class="muted" font-size="13">Systems, addons, tools,</text>
    <text x="20" y="112" class="muted" font-size="13">and the worlds they support.</text>
    <circle cx="329" cy="25" r="4" fill="#1be0d0"/>
  </g><g transform="translate(422 62)">
    <rect width="356" height="135" rx="12" fill="#082326" stroke="#ff9b42" stroke-opacity=".55"/>
    <text x="20" y="31" class="mono" fill="#ff9b42" font-size="11" letter-spacing="1.3">FLY // 02</text>
    <text x="20" y="63" class="title" font-size="19">AVIATION</text>
    <text x="20" y="92" class="muted" font-size="13">Soaring, weather signals,</text>
    <text x="20" y="112" class="muted" font-size="13">and flight-planning automation.</text>
    <circle cx="329" cy="25" r="4" fill="#ff9b42"/>
  </g><g transform="translate(806 62)">
    <rect width="356" height="135" rx="12" fill="#082326" stroke="#1be0d0" stroke-opacity=".55"/>
    <text x="20" y="31" class="mono" fill="#1be0d0" font-size="11" letter-spacing="1.3">TEST // 03</text>
    <text x="20" y="63" class="title" font-size="19">EXPERIMENTATION</text>
    <text x="20" y="92" class="muted" font-size="13">Turning a stubborn what if</text>
    <text x="20" y="112" class="muted" font-size="13">into a working prototype.</text>
    <circle cx="329" cy="25" r="4" fill="#1be0d0"/>
  </g>
