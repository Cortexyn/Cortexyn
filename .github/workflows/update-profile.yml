name: Update public profile telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

concurrency:
  group: profile-telemetry
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v7

      - name: Generate the public statistics card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_profile.py --username "${{ github.repository_owner }}" --output assets/github-stats.svg

      - name: Generate the static dashboard modules
        run: python3 scripts/generate_assets.py

      - name: Commit refreshed dashboard assets when they changed
        shell: bash
        run: |
          if git diff --quiet -- assets/; then
            echo "No generated assets changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "chore: refresh public profile dashboard"
          git push
